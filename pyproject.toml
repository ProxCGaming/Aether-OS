[project]
name = "aether-os"
version = "0.1.0"
description = "Aether-OS: local AI agent OS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "PySide6>=6.6.0",
    "qasync>=0.27.1",
    "httpx>=0.27.0",
    "google-genai>=2.0.0",
    "litellm>=1.70.0",
    "APScheduler>=3.10.4",
    "langgraph>=1.2.16,<1.3.0",
    "langgraph-checkpoint>=4.3.0,<5.0.0",
    "langgraph-checkpoint-sqlite>=3.1.2,<4.0.0",
    "langchain-core>=1.6.7,<2.0.0",
    "mcp>=1.30.0,<2.0.0",
    "ddgs>=9.0.0",
    "PyYAML>=6.0.1",
    "keyring>=24.0.0",
    # Direct imports with no entry in the old requirements files (found by import scan):
    # aether_ui/components/chat_bubble.py imports markdown; aether_engine/langgraph/executor.py imports aiosqlite.
    "markdown>=3.0",
    "aiosqlite>=0.22.1",
    # Windows-only: no Linux/macOS wheels exist; uv skips it elsewhere.
    "pywin32>=306; sys_platform == 'win32'",
    "pydantic>=2.14.0,<3.0.0",
    "langgraph-supervisor>=0.0.31",
    "trafilatura>=2.3.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.17.0",
]

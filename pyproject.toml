[project]
name = "aether-os"
# Mirror of APP_VERSION in aether_engine/version.py (the single source
# of truth). This project is virtual for uv (no [build-system]; uv.lock
# records source = { virtual = "." }), so the version cannot be read
# dynamically at build time — tests/test_epic10_hardening.py pins this
# value, desktop_app/package.json and the root package.json to
# APP_VERSION so they cannot drift.
version = "0.3.5"
description = "Aether-OS: local AI agent OS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "google-genai>=2.0.0",
    "litellm>=1.70.0",
    "APScheduler>=3.10.4",
    "langgraph>=1.2.16,<1.3.0",
    "langgraph-checkpoint>=4.3.0,<5.0.0",
    "langgraph-checkpoint-sqlite>=3.1.2,<4.0.0",
    "langchain-core>=1.6.7,<2.0.0",
    "mcp>=1.30.0,<2.0.0",
    "ddgs>=9.0.0",
    "PyYAML>=6.0.1",
    "keyring>=24.0.0",
    # Direct import with no entry in the old requirements files (found by import scan):
    # aether_engine/langgraph/executor.py imports aiosqlite.
    "aiosqlite>=0.22.1",
    # Windows-only: no Linux/macOS wheels exist; uv skips it elsewhere.
    "pywin32>=306; sys_platform == 'win32'",
    "pydantic>=2.14.0,<3.0.0",
    "langgraph-supervisor>=0.0.31",
    "trafilatura>=2.3.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "numpy>=2.5.4",
    "aiortc>=1.15.0",
    "publicsuffix2>=2.20191221",
    "playwright>=1.64.1",
]

# Skill registry CLI (Epic 7, E7-F09; addendum omp #28): install /
# search / list over skills.lock.json. The module entry point is the
# same function run_skills.py calls; `python -m aether_engine.skills.cli`
# works too.
[project.scripts]
aether-skills = "aether_engine.skills.cli:main"

[project.optional-dependencies]
# Local voice stack (aether_engine/voice/ — Silero VAD, faster-whisper
# STT, Kokoro TTS): NOT installed by default. Its stages are the only
# consumers of these packages; they probe with find_spec, import
# lazily in open(), and fail closed with an honest "voice unavailable"
# reason when the extra is absent. Install with:
#   uv sync --extra voice
voice = [
    "faster-whisper>=1.2.1",
    "kokoro>=0.9.4",
    "onnxruntime>=1.31.1",
    "silero-vad>=6.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.17.0",
]

# Coverage (S5-M11): measurement only — no fail-under threshold yet.
# `source` is the engine package; the desktop app is measured by Jest
# (see desktop_app/jest.config.cjs). Local commands are documented in
# README.md ("Test" section); CI passes the --cov flags explicitly so
# plain `uv run pytest` stays a fast, coverage-free gate.
[tool.coverage.run]
source = ["aether_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

# Ruff (S5-N5): the lint gate (scripts/run-ruff.sh, via lint-staged)
# previously ran on ambient defaults alone — nothing in the repo said
# which Python or line length the linter should assume. The values
# the gate has always effectively used are declared here; the rule
# selection itself is intentionally left to the defaults, so this
# section changes no lint outcome (verified: identical full-tree
# output before and after).
[tool.ruff]
target-version = "py312"
line-length = 88

[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
# Coverage is opt-in, not in addopts: pass the flags explicitly (see
# README "Test" section) so the plain gate stays fast. The flags are:
#   --cov=aether_engine --cov-report=term-missing
#   --cov-report=xml:coverage.xml --cov-report=html:htmlcov
# Measurement config ([tool.coverage]) lives in pyproject.toml.
# No --cov-fail-under: measurement first (S5-M11), no threshold yet.

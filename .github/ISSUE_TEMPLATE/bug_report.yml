name: Bug report
description: Something in Aether-OS does not work as documented.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the README's Known limitations
        section first — if it is listed there, it is already tracked.
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - Desktop app (Electron UI)
        - Engine (Python backend)
        - Voice mode
        - Installer / packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from launching the app.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the app header and in README (currently 0.3.5).
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: |
        Settings → Advanced can export a redacted diagnostics bundle (no
        API keys, no memory content). Paste anything relevant from it —
        never paste raw config or vault files.

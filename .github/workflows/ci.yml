# Minimal CI for Aether-OS (Phase 10.3 D1).
#
# Runs the repo's real test commands on every push / PR:
#   - pytest over the full tests/ selection — the same suite the local
#     gate runs. There are NO --ignore flags (S5-M6): the four legacy
#     PySide6 UI test files that used to be ignored
#     (tests/test_provider_health_badge.py,
#     tests/test_providers_panel_fixes.py,
#     tests/test_settings_provider_state.py,
#     tests/test_ui_window_geometry.py) each self-skip at module level
#     via pytest.importorskip("PySide6"), and this job installs with a
#     plain `uv sync` (no legacy-ui extra), so in CI they are skipped,
#     not failed. The ignore flags only made CI judge a smaller suite
#     than the local gate for no benefit.
#     Caveat if the install ever gains --extra legacy-ui: all four
#     files then pass in a clean environment (locally verified
#     2 Nov 2026 with QT_QPA_PLATFORM=offscreen: 36 passed). Two tests
#     in tests/test_providers_panel_fixes.py are nevertheless listed
#     in scripts/pytest-known-failures.txt: they fail only when the
#     environment carries a proxy NO_PROXY value that httpx cannot
#     parse (as in the Muse VM), and pass with a clean env. CI has
#     no baseline mechanism, so an env-dependent failure like that
#     would redden this job where the local subset rule tolerates it.
#   - Jest in desktop_app/ (npm test -- --watchAll=false).
#   - Coverage on both jobs (S5-M11): measured and uploaded as
#     artifacts, with NO failing threshold — measurement first.
#
# Known limits (do NOT read a green run here as a full release gate):
#   - The pytest job installs dependencies with `uv sync` from
#     pyproject.toml / uv.lock, which include APScheduler, so scheduler
#     tests run with HAS_APSCHEDULER=True rather than the graceful
#     degradation seen in the old .venv-phase9 environment (see ADR 0025).
#   - The pytest job does not run the Electron app or the Windows-only
#     paths (pywin32 is marker-guarded to Windows in pyproject.toml).
#   - Packaging (electron-builder) is NOT run here; `npm run dist` is a
#     manual release step until a Windows packaging job is added.
name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync
      - name: Run pytest with coverage
        run: >-
          uv run python -m pytest -q
          --cov=aether_engine
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
      - name: Upload Python coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  frontend:
    name: Jest (desktop_app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop_app
    steps:
      - uses: actions/checkout@v4
      # Electron 44 (desktop_app/package.json) bundles Node 24; use the
      # same major line as the local toolchain (node v24.22.1).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop_app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Jest with coverage
        run: npm run test:coverage
      - name: Upload Jest coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: desktop_app/coverage/
          if-no-files-found: ignore

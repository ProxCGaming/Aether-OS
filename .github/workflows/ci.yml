# Minimal CI for Aether-OS (Phase 10.3 D1).
#
# Runs the repo's real test commands on every push / PR:
#   - pytest over the full tests/ selection — the same suite the local
#     gate runs. There are NO --ignore flags (S5-M6): the suite is
#     judged whole. (The four legacy PySide6 UI test files that once
#     self-skipped via pytest.importorskip("PySide6") were deleted
#     with the retired aether_ui/ tree on 2 Nov 2026, together with
#     the legacy-ui extra; their two baseline entries left
#     scripts/pytest-known-failures.txt with them.)
#     The pytest job is therefore judged by the F-18 SUBSET RULE —
#     the same rule .husky/pre-push applies locally (owner decision,
#     1 Nov 2026): pytest writes a JUnit report, and
#     scripts/ci_pytest_subset.py fails the job ONLY when a failure
#     is not listed in scripts/pytest-known-failures.txt. Baseline
#     entries that now pass are noted in the log, never a failure.
#     A missing/empty report fails closed — an unjudgeable run is
#     never a pass.
#   - Jest in desktop_app/ (npm test -- --watchAll=false).
#   - Lint, mirroring the local commit gate (lint-staged): oxlint
#     over the whole desktop_app (the repo's `npm run lint` scope;
#     warnings do not block, errors do), and Ruff via the repo's
#     scripts/run-ruff.sh over the Python files CHANGED by the
#     push/PR — the same file set lint-staged judges locally. A
#     whole-tree Ruff run is not green today and cannot gate yet:
#     it reports 136 findings, almost all pre-existing debt in
#     tests/ (129) and scripts/ (5) that the staged-file hooks never
#     judged (aether_engine itself carries 2). The retired aether_ui/
#     tree's 170 findings left with the tree when it was deleted on
#     2 Nov 2026. Until the remaining debt is cleared, changed-file
#     gating is the honest equivalent of the local rule.
#   - Gitleaks over the full git history (the local pre-commit hook
#     only sees staged files via `protect --staged`; CI catches
#     what hooks cannot, e.g. commits made through the web UI),
#     using the repo's .gitleaks.toml allowlist.
#   - Coverage on both jobs (S5-M11): measured and uploaded as
#     artifacts, with NO failing threshold — measurement first.
#   - Locked dependencies (Risk #1, closed): pyproject.toml is the
#     intent and uv.lock is the ONLY install source — the old
#     requirements.txt / requirements-lock.txt pair is deleted (the
#     lock was a test-venv freeze missing 8 packages: uvicorn,
#     PySide6, qasync, google-genai, APScheduler, pywin32, ddgs,
#     keyring). Every Python job (a) fails if uv.lock is out of date
#     with pyproject.toml (`uv lock --check`), (b) creates its venv
#     explicitly (`uv venv .venv --python 3.12`), and (c) installs
#     ONLY from the lock (`uv sync --locked` — CI can never silently
#     re-resolve or drift). The dedicated deps job goes further: a
#     clean venv installed with `--all-extras` (so the voice extra
#     is locked and importable too, not just the default set) plus
#     an import smoke test for the packages the old lock missed.
#     tests/test_locked_deps_ci.py pins this contract.
#
# Known limits (do NOT read a green run here as a full release gate):
#   - The pytest job installs dependencies with `uv sync --locked`
#     from pyproject.toml / uv.lock, which include APScheduler, so scheduler
#     tests run with HAS_APSCHEDULER=True rather than the graceful
#     degradation seen in the old .venv-phase9 environment (see ADR 0025).
#   - The pytest job does not run the Electron app or the Windows-only
#     paths (pywin32 is marker-guarded to Windows in pyproject.toml).
#   - Packaging (electron-builder) is NOT run here; it lives in
#     .github/workflows/release.yml, which builds the Windows NSIS
#     and Linux AppImage installers when a version tag is pushed.
name: CI

on:
  push:
  pull_request:

jobs:
  deps:
    name: locked deps (uv.lock + venv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Check uv.lock is up to date with pyproject.toml
        run: uv lock --check
      - name: Create venv (Python 3.12)
        run: uv venv .venv --python 3.12
      - name: Install ALL dependencies from the lock (incl. extras)
        run: uv sync --locked --all-extras
      - name: Verify the venv is complete (import smoke test)
        # The old requirements-lock.txt was frozen from a test venv
        # and silently missed 8 packages. This smoke test imports
        # exactly the packages that lock missed (PySide6/qasync left
        # with the retired UI; pywin32 is Windows-only and resolves
        # via its platform marker there) plus the voice extra, so a
        # lock that is incomplete again fails HERE, loudly.
        run: >-
          .venv/bin/python -c "import sys;
          assert sys.version_info[:2] == (3, 12), sys.version;
          import uvicorn, google.genai, apscheduler, ddgs, keyring,
          aiosqlite, faster_whisper, kokoro, onnxruntime, silero_vad;
          print('locked venv import smoke: ok')"

  python:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Check uv.lock is up to date with pyproject.toml
        run: uv lock --check
      - name: Create venv (Python 3.12)
        run: uv venv .venv --python 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Run pytest with coverage
        # pytest's exit code is deliberately discarded (|| true): the
        # suite is judged by its failure LIST via the subset rule in
        # the next step, exactly as .husky/pre-push judges it locally
        # (there, pytest can even exit 139 on Qt teardown after a
        # complete run). A crash that leaves no JUnit report fails
        # closed in the judge step instead of passing silently.
        run: >-
          uv run python -m pytest -q
          --cov=aether_engine
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
          --junitxml=pytest-results.xml
          || true
      - name: Judge pytest against the known-failures baseline
        run: uv run python scripts/ci_pytest_subset.py pytest-results.xml
      - name: Upload Python coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/
            pytest-results.xml
          if-no-files-found: ignore

  frontend:
    name: Jest (desktop_app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop_app
    steps:
      - uses: actions/checkout@v4
      # Electron 44 (desktop_app/package.json) bundles Node 24; use the
      # same major line as the local toolchain (node v24.22.1).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop_app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Jest with coverage
        run: npm run test:coverage
      - name: Upload Jest coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: desktop_app/coverage/
          if-no-files-found: ignore

  lint:
    name: lint (ruff + oxlint)
    runs-on: ubuntu-latest
    steps:
      # Full history: the Ruff step diffs the push/PR against its base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Check uv.lock is up to date with pyproject.toml
        run: uv lock --check
      - name: Create venv (Python 3.12)
        run: uv venv .venv --python 3.12
      - name: Install Python dependencies (locked)
        run: uv sync --locked
      - name: Ruff on changed Python files (repo script)
        # Same judgement as the local commit gate: lint-staged runs
        # scripts/run-ruff.sh on the files being committed, so CI runs
        # it on the files this push/PR changes. Whole-tree Ruff is
        # not green yet (see the header comment) and cannot gate.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null; then
            BASE="HEAD~1"
          fi
          echo "Diffing against $BASE"
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.py' > changed-py.txt
          if [ -s changed-py.txt ]; then
            echo "Ruff judging the changed Python files:"
            cat changed-py.txt
            xargs -a changed-py.txt -r bash scripts/run-ruff.sh
          else
            echo "No Python files changed — nothing for Ruff to judge."
          fi
      # Electron 44 bundles Node 24 — same major line as CI's Jest job.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop_app/package-lock.json
      - name: Install desktop_app dependencies
        working-directory: desktop_app
        run: npm ci
      - name: oxlint on desktop_app (repo script)
        # scripts/run-oxlint.sh cds into desktop_app and honours its
        # .oxlintrc.json; "." lints the whole app, the same scope as
        # `npm run lint`. Errors block; warnings do not (the script's
        # own semantics, same as the local gate).
        run: bash scripts/run-oxlint.sh .

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      # Full history: the point of this job is to scan commits the
      # local staged-file hook never saw.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The repo's own allowlist (placeholder VALUES only — real
          # keys are flagged even in test files, per S5-M10). For a
          # personal-account repo no GITLEAKS_LICENSE is required.
          GITLEAKS_CONFIG: .gitleaks.toml

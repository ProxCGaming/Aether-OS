# Release workflow for Aether-OS — the CD half of CI/CD.
#
# What it does:
#   - First, a gate job runs the test suites for the tagged commit
#     (pytest judged by the same F-18 subset rule CI uses, plus the
#     full Jest suite). The publish job needs the gate (D4-05):
#     ci.yml and this workflow trigger independently on the same
#     tag, so without the gate a tag on a red commit — or one whose
#     CI simply has not finished — would still publish installers.
#   - On a pushed version tag (v*), or manually via workflow_dispatch:
#     build the desktop installers with desktop_app's `npm run dist`
#     (electron-builder) — NSIS on windows-latest, AppImage on
#     ubuntu-latest — and upload each OS's installer plus a sha256
#     checksum file as workflow artifacts.
#   - On a tag push only, a final job then creates a GitHub Release
#     for that tag with the installers and checksums attached.
#     Release notes are the CHANGELOG.md section for the version when
#     one exists, and a plain fallback note when it does not.
#
# Honest limits:
#   - Installers are UNSIGNED. No code-signing certificate exists for
#     this project, so Windows SmartScreen / macOS Gatekeeper-style
#     warnings are expected; nothing here pretends otherwise.
#   - Nothing is published anywhere except the GitHub Release, and
#     nothing is deployed to any server. CD here means exactly:
#     tag -> built installers attached to a GitHub Release.
#   - The version is single-sourced (aether_engine/version.py, with
#     desktop_app/package.json as a pinned mirror). The build jobs
#     fail loudly if a tag disagrees with it, so a release can never
#     be labelled with a version the app itself does not carry.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag label for this build (e.g. v0.3.5). Manual runs build and upload artifacts only — no GitHub Release is created."
        required: false
        type: string

# Build jobs only read the repo; the write grant is scoped to the
# release job below.
permissions:
  contents: read

jobs:
  gate:
    name: Test gates (pytest + Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Check uv.lock is up to date with pyproject.toml
        run: uv lock --check
      - name: Create venv (Python 3.12)
        run: uv venv .venv --python 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Run pytest
        # Same judging as CI's python job: pytest's exit code is
        # deliberately discarded and the JUnit report is judged by
        # the F-18 subset rule, so "the gate passed" here means
        # exactly what a green CI python job means.
        run: >-
          uv run python -m pytest -q
          --junitxml=pytest-results.xml
          || true
      - name: Judge pytest against the known-failures baseline
        run: uv run python scripts/ci_pytest_subset.py pytest-results.xml
      # Electron 44 bundles Node 24 — same major line as CI's Jest job.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop_app/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop_app
        run: npm ci
      - name: Run Jest
        working-directory: desktop_app
        run: npm run test:coverage

  build-windows:
    name: Build installer (Windows NSIS)
    # NOTE (5 Nov 2026): desktop_app/package.json sets
    # win.signExecutable=false — the builds are unsigned, and the
    # per-file signing pass over the bundled Python payload cost
    # minutes while applying nothing. WHEN a code-signing
    # certificate is added (CSC_LINK secret), flip signExecutable
    # back to true in the same change, or the release will silently
    # ship unsigned.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop_app
    steps:
      - uses: actions/checkout@v4
      # Same Node line as CI (Electron 44 bundles Node 24).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop_app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # D4-17: the version rule lives once, in
      # scripts/check_version_consistency.py — both build jobs call
      # it instead of carrying verbatim bash copies that can drift.
      - name: Check version consistency
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          python ../scripts/check_version_consistency.py "$tag"
      - name: Install dependencies
        run: npm ci
      # E10-F06: assemble the bundled engine payload (portable
      # Python + the engine's code and libraries, as files) that
      # package.json's extraResources carries into the installer.
      # Without this step the installer ships the shell alone and
      # the app has no engine to connect to.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Assemble bundled engine payload
        shell: bash
        run: python ../scripts/assemble_engine_payload.py --platform win32
      - name: Build installer (NSIS)
        run: npm run dist
      - name: List installer output
        shell: bash
        run: ls -la dist-electron/
      - name: Write sha256 checksums
        shell: bash
        run: |
          cd dist-electron
          sha256sum *.exe > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Aether-OS-Windows-NSIS
          path: |
            desktop_app/dist-electron/*.exe
            desktop_app/dist-electron/SHA256SUMS-windows.txt
          if-no-files-found: error

  build-linux:
    name: Build installer (Linux AppImage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop_app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # D4-17: shared version check — see the Windows job.
      - name: Check version consistency
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          python ../scripts/check_version_consistency.py "$tag"
      - name: Install dependencies
        run: npm ci
      # E10-F06: assemble the bundled engine payload (portable
      # Python + the engine's code and libraries, as files) that
      # package.json's extraResources carries into the installer.
      # Without this step the installer ships the shell alone and
      # the app has no engine to connect to.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Assemble bundled engine payload
        shell: bash
        run: python ../scripts/assemble_engine_payload.py --platform linux
      - name: Build installer (AppImage)
        run: npm run dist
      - name: List installer output
        shell: bash
        run: ls -la dist-electron/
      - name: Write sha256 checksums
        shell: bash
        run: |
          cd dist-electron
          sha256sum *.AppImage > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: Aether-OS-Linux-AppImage
          path: |
            desktop_app/dist-electron/*.AppImage
            desktop_app/dist-electron/SHA256SUMS-linux.txt
          if-no-files-found: error

  release:
    name: GitHub Release
    # Tag pushes only — manual dispatch runs stop at the artifacts.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [gate, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.lstrip("v")
          changelog = Path("CHANGELOG.md")
          notes = ""
          if changelog.is_file():
              text = changelog.read_text(encoding="utf-8")
              match = re.search(
                  rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)",
                  text,
                  re.M | re.S,
              )
              if match:
                  notes = match.group(0).strip() + "\n"
          if not notes:
              notes = (
                  f"Aether-OS {tag}\n\n"
                  "No CHANGELOG.md section for this version — "
                  "see CHANGELOG.md for the full history.\n"
              )
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          print(notes)
          PYEOF
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Aether-OS ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release-files/*.exe
            release-files/*.AppImage
            release-files/SHA256SUMS-windows.txt
            release-files/SHA256SUMS-linux.txt
